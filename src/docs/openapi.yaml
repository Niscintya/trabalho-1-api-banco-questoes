openapi: 3.0.3

info:
  title: API Banco de Questões
  description: >
    API REST para gerenciamento de um Banco de Questões,
    com PostgreSQL, Sequelize ORM, notificações persistentes
    e comunicação em tempo real por WebSocket.
  version: 4.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Questões
  - name: Disciplinas
  - name: Categorias
  - name: Assuntos
  - name: Notificações
  - name: Sistema

paths:

  /health:
    get:
      tags:
        - Sistema
      summary: Verifica a saúde da aplicação
      responses:
        '200':
          description: Aplicação funcionando corretamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  api:
                    type: string
                    example: online
                  websocket:
                    type: string
                    example: ativo

  /questoes:
    get:
      tags:
        - Questões
      summary: Lista questões
      description: >
        Lista questões com filtros, busca, paginação
        e ordenação.
      parameters:
        - name: dificuldade
          in: query
          required: false
          schema:
            type: string
          example: facil

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - rascunho
              - em_revisao
              - aprovada
          example: em_revisao

        - name: busca
          in: query
          required: false
          schema:
            type: string
          example: porcentagem

        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          example: 10

        - name: ordenar
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - enunciado
              - dificuldade
              - status
              - createdAt
          example: id

        - name: direcao
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc

      responses:
        '200':
          description: Lista de questões retornada com sucesso
        '500':
          description: Erro interno do servidor

    post:
      tags:
        - Questões
      summary: Cria uma questão
      description: >
        Cria uma nova questão e permite relacioná-la
        a um ou mais assuntos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestaoEntrada'
      responses:
        '201':
          description: Questão criada com sucesso
        '400':
          description: Dados inválidos
        '404':
          description: Disciplina, categoria ou assunto não encontrado
        '409':
          description: Conflito de integridade
        '500':
          description: Erro interno do servidor

  /questoes/{id}:
    get:
      tags:
        - Questões
      summary: Busca uma questão por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Questão encontrada
        '404':
          description: Questão não encontrada

    put:
      tags:
        - Questões
      summary: Substitui uma questão
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestaoEntrada'
      responses:
        '200':
          description: Questão atualizada
        '400':
          description: Dados inválidos
        '404':
          description: Questão, disciplina, categoria ou assunto não encontrado
        '409':
          description: Conflito de integridade

    patch:
      tags:
        - Questões
      summary: Atualiza parcialmente uma questão
      description: >
        Permite também alterar o status da questão.
        Quando o status muda, uma notificação persistente
        é criada e eventos WebSocket são emitidos.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestaoAtualizacao'
      responses:
        '200':
          description: Questão atualizada
        '400':
          description: Dados inválidos ou status inválido
        '404':
          description: Questão, disciplina, categoria ou assunto não encontrado
        '409':
          description: Conflito de integridade

    delete:
      tags:
        - Questões
      summary: Exclui uma questão
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Questão excluída
        '404':
          description: Questão não encontrada

  /disciplinas:
    get:
      tags:
        - Disciplinas
      summary: Lista todas as disciplinas
      responses:
        '200':
          description: Lista de disciplinas

    post:
      tags:
        - Disciplinas
      summary: Cria uma disciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disciplina'
      responses:
        '201':
          description: Disciplina criada
        '400':
          description: Nome obrigatório ou dados inválidos
        '409':
          description: Disciplina já cadastrada

  /disciplinas/{id}:
    get:
      tags:
        - Disciplinas
      summary: Busca uma disciplina por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Disciplina encontrada
        '404':
          description: Disciplina não encontrada

    put:
      tags:
        - Disciplinas
      summary: Substitui uma disciplina
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disciplina'
      responses:
        '200':
          description: Disciplina atualizada
        '400':
          description: Nome obrigatório
        '404':
          description: Disciplina não encontrada
        '409':
          description: Nome já cadastrado

    patch:
      tags:
        - Disciplinas
      summary: Atualiza parcialmente uma disciplina
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disciplina'
      responses:
        '200':
          description: Disciplina atualizada
        '404':
          description: Disciplina não encontrada
        '409':
          description: Nome já cadastrado

    delete:
      tags:
        - Disciplinas
      summary: Exclui uma disciplina
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Disciplina excluída
        '404':
          description: Disciplina não encontrada
        '409':
          description: >
            Exclusão não permitida porque existem
            questões relacionadas à disciplina

  /disciplinas/{id}/questoes:
    get:
      tags:
        - Disciplinas
      summary: Lista as questões de uma disciplina
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Questões relacionadas à disciplina
        '404':
          description: Disciplina não encontrada

  /categorias:
    get:
      tags:
        - Categorias
      summary: Lista todas as categorias
      responses:
        '200':
          description: Lista de categorias

    post:
      tags:
        - Categorias
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '201':
          description: Categoria criada
        '400':
          description: Nome obrigatório ou dados inválidos
        '409':
          description: Categoria já cadastrada

  /categorias/{id}:
    get:
      tags:
        - Categorias
      summary: Busca uma categoria por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoria encontrada
        '404':
          description: Categoria não encontrada

    put:
      tags:
        - Categorias
      summary: Substitui uma categoria
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '200':
          description: Categoria atualizada
        '400':
          description: Nome obrigatório
        '404':
          description: Categoria não encontrada
        '409':
          description: Nome já cadastrado

    patch:
      tags:
        - Categorias
      summary: Atualiza parcialmente uma categoria
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '200':
          description: Categoria atualizada
        '404':
          description: Categoria não encontrada
        '409':
          description: Nome já cadastrado

    delete:
      tags:
        - Categorias
      summary: Exclui uma categoria
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Categoria excluída
        '404':
          description: Categoria não encontrada
        '409':
          description: >
            Exclusão não permitida porque existem
            questões relacionadas à categoria

  /assuntos:
    get:
      tags:
        - Assuntos
      summary: Lista todos os assuntos
      responses:
        '200':
          description: Lista de assuntos

    post:
      tags:
        - Assuntos
      summary: Cria um assunto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assunto'
      responses:
        '201':
          description: Assunto criado
        '400':
          description: Nome obrigatório ou dados inválidos
        '409':
          description: Assunto já cadastrado

  /assuntos/{id}:
    get:
      tags:
        - Assuntos
      summary: Busca um assunto por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Assunto encontrado
        '404':
          description: Assunto não encontrado

    put:
      tags:
        - Assuntos
      summary: Substitui um assunto
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assunto'
      responses:
        '200':
          description: Assunto atualizado
        '400':
          description: Nome obrigatório
        '404':
          description: Assunto não encontrado
        '409':
          description: Nome já cadastrado

    patch:
      tags:
        - Assuntos
      summary: Atualiza parcialmente um assunto
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assunto'
      responses:
        '200':
          description: Assunto atualizado
        '404':
          description: Assunto não encontrado
        '409':
          description: Nome já cadastrado

    delete:
      tags:
        - Assuntos
      summary: Exclui um assunto
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Assunto excluído
        '404':
          description: Assunto não encontrado

  /notificacoes:
    get:
      tags:
        - Notificações
      summary: Lista notificações
      description: >
        Lista notificações persistidas no PostgreSQL,
        com filtros e paginação.
      parameters:
        - name: lida
          in: query
          required: false
          schema:
            type: boolean
          example: false

        - name: disciplinaId
          in: query
          required: false
          schema:
            type: integer
          example: 1

        - name: tipo
          in: query
          required: false
          schema:
            type: string
          example: status_questao_alterado

        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10

      responses:
        '200':
          description: Lista de notificações retornada

    post:
      tags:
        - Notificações
      summary: Cria uma notificação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacaoEntrada'
      responses:
        '201':
          description: Notificação criada
        '400':
          description: Dados inválidos
        '404':
          description: Questão ou disciplina não encontrada

  /notificacoes/marcar-todas-como-lidas:
    patch:
      tags:
        - Notificações
      summary: Marca todas as notificações como lidas
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                disciplinaId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Notificações marcadas como lidas

  /notificacoes/{id}:
    get:
      tags:
        - Notificações
      summary: Busca uma notificação por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Notificação encontrada
        '404':
          description: Notificação não encontrada

    delete:
      tags:
        - Notificações
      summary: Exclui uma notificação
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Notificação excluída
        '404':
          description: Notificação não encontrada

  /notificacoes/{id}/marcar-como-lida:
    patch:
      tags:
        - Notificações
      summary: Marca uma notificação como lida
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Notificação marcada como lida
        '404':
          description: Notificação não encontrada

components:

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador do registro
      schema:
        type: integer
        minimum: 1

  schemas:

    QuestaoEntrada:
      type: object
      required:
        - enunciado
        - disciplinaId
        - categoriaId
      properties:
        enunciado:
          type: string
          example: Qual é 20% de 100?

        disciplinaId:
          type: integer
          example: 1

        categoriaId:
          type: integer
          example: 1

        dificuldade:
          type: string
          default: media
          example: facil

        status:
          type: string
          enum:
            - rascunho
            - em_revisao
            - aprovada
          default: rascunho
          example: rascunho

        assuntoIds:
          type: array
          description: IDs dos assuntos relacionados à questão
          items:
            type: integer
          example:
            - 1
            - 2

    QuestaoAtualizacao:
      type: object
      properties:
        enunciado:
          type: string
          example: Qual é 25% de 200?

        disciplinaId:
          type: integer
          example: 1

        categoriaId:
          type: integer
          example: 1

        dificuldade:
          type: string
          example: media

        status:
          type: string
          enum:
            - rascunho
            - em_revisao
            - aprovada
          example: em_revisao

        assuntoIds:
          type: array
          items:
            type: integer
          example:
            - 1
            - 2

    Disciplina:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: Matemática

    Categoria:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: Álgebra

    Assunto:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: Porcentagem

    NotificacaoEntrada:
      type: object
      required:
        - mensagem
        - tipo
        - disciplinaId
      properties:
        mensagem:
          type: string
          example: Questão 12 teve seu status alterado

        tipo:
          type: string
          example: status_questao_alterado

        questaoId:
          type: integer
          nullable: true
          example: 12

        disciplinaId:
          type: integer
          example: 1

    Notificacao:
      type: object
      properties:
        id:
          type: integer
          example: 1

        mensagem:
          type: string
          example: Questão 12 teve seu status alterado

        tipo:
          type: string
          example: status_questao_alterado

        lida:
          type: boolean
          example: false

        questaoId:
          type: integer
          nullable: true
          example: 12

        disciplinaId:
          type: integer
          example: 1